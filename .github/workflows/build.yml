name: Build THEK (v2rayNG)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Fetch AndroidLibXrayLite tag
        id: fetch-tag
        run: |
          cd AndroidLibXrayLite
          echo "TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          wget -q https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ steps.fetch-tag.outputs.TAG }}/libv2ray.aar -O V2rayNG/app/libs/libv2ray.aar
          ls -la V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleFdroidDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thek-v2rayng-debug
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
